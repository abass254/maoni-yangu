# Deploy: Render → New → Blueprint → connect abass254/maoni-yangu
# Or: New Web Service with Root Directory LEFT BLANK (commands cd into backend).
services:
  - type: web
    name: maoni-yangu-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /api/health
    envVars:
      - key: SURVEY_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
        # Set after Vercel deploy, e.g. https://your-app.vercel.app
      - key: DATABASE_URL
        sync: false
        # mysql://survey_user:PASSWORD@db.tiberbu.com:3306/survey
